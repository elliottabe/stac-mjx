# STAC pipeline configuration - paths resolved via Hydra interpolation
# Use: python run_stac_fly_model.py paths=workstation dataset=free_walking version=<your_version>

# Input/output paths (resolved from paths config)
data_path: "${paths.data_dir}/${dataset.preprocessing.input_filename}"
save_path: "${paths.data_dir}"
xml_dir: "${paths.body_model_dir}/${anatomy.name}/"

# Output filenames
fit_offsets_path: "${dataset.stac_ik.fit_offsets_filename}"
ik_only_path: "${dataset.stac_ik.ik_only_filename}"

# STAC IK parameters (from dataset config)
continuous: ${dataset.stac_ik.continuous}
enable_padding: ${dataset.stac_ik.enable_padding}
n_fit_frames: ${dataset.stac_ik.n_fit_frames}
n_frames_per_clip: ${dataset.stac_ik.n_frames_per_clip}
num_clips: 0  # Computed dynamically, placeholder for dataclass
skip_fit_offsets: ${dataset.stac_ik.skip_fit_offsets}
skip_ik_only: ${dataset.stac_ik.skip_ik_only}
infer_qvels: ${dataset.stac_ik.infer_qvels}

mujoco: ${dataset.stac_ik.mujoco}
