# @package _global_.dataset

name: courtship
env_name: courtship

# Dataset version
version: Jan_23

# Preprocessing settings
preprocessing:
  input_filename: preprocessed_bout.h5
  bouts_csv: null

# STAC IK settings
stac_ik:
  continuous: False
  enable_padding: True
  n_fit_frames: 500
  n_frames_per_clip: 500
  skip_fit_offsets: False
  skip_ik_only: False
  infer_qvels: True
  
  # Output filenames (saved to data_dir)
  fit_offsets_filename: "Fruitfly_fit_V1_courtship.h5"
  ik_only_filename: "Fruitfly_ik_V1_courtship.h5"
  
  mujoco:
    solver: "cg"
    iterations: 1
    ls_iterations: 4
    dt: 0.00125